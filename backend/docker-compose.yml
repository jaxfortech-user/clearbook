version: "3.9"

services:
  api:
    image: ${ECR_IMAGE:-clearbook-api:latest}
    container_name: clearbook_api
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - clearbook_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  clearbook_net:
    driver: bridge